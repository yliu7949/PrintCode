name: Rust

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --verbose

  package:
    name: Package ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
            binary: printcode
          - name: macos-aarch64
            os: macos-latest
            archive: tar.gz
            binary: printcode
          - name: macos-x86_64
            os: macos-13
            archive: tar.gz
            binary: printcode
          - name: windows-x86_64
            os: windows-latest
            archive: zip
            binary: printcode.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/printcode-${{ matrix.name }}"
          cp "target/release/${{ matrix.binary }}" "dist/printcode-${{ matrix.name }}/"
          cp README.md LICENSE "dist/printcode-${{ matrix.name }}/"

      - name: Archive package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "printcode-${{ matrix.name }}.zip" "printcode-${{ matrix.name }}"
          else
            tar -czf "printcode-${{ matrix.name }}.tar.gz" "printcode-${{ matrix.name }}"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: printcode-${{ matrix.name }}
          path: dist/printcode-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create Release
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read package version
        id: package
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Archive source code
        run: |
          set -euo pipefail
          tag="${{ steps.package.outputs.tag }}"
          git archive --format=tar.gz \
            --output "dist/printcode-${tag}-source.tar.gz" HEAD
          git archive --format=zip \
            --output "dist/printcode-${tag}-source.zip" HEAD

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          PrintCode release ${{ steps.package.outputs.tag }}.

          This release includes cross-platform command line binaries and source code archives.

          Assets:
          - Linux x86_64 binary
          - macOS Apple Silicon binary
          - macOS Intel binary
          - Windows x86_64 binary
          - Source code archives
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" dist/* \
            --title "PrintCode ${{ steps.package.outputs.tag }}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
